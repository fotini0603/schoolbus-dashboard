<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>School Bus Dashboard</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #map {
      width: 70%;
      height: 100%;
    }

    #panel {
      width: 30%;
      background: #f5f5f5;
      padding: 20px;
      box-shadow: -2px 0 5px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
    }

    .infoBox {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      font-size: 18px;
    }

    .label {
      font-weight: bold;
      color: #444;
    }
  </style>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>
<body>

  <div id="map"></div>

  <div id="panel">
    <div class="title">School Bus Dashboard</div>

    <div class="infoBox">
      <span class="label">Speed:</span>
      <span id="speed">--</span> km/h
    </div>

    <div class="infoBox">
      <span class="label">Alcohol:</span>
      <span id="alcohol">--</span>
    </div>

    <div class="infoBox">
      <span class="label">Acceleration:</span>
      <span id="acc">--</span>
    </div>

    <div class="infoBox">
      <span class="label">Last Update:</span>
      <span id="time">--</span>
    </div>
  </div>

  <script>
    // Initialize map
    let map = L.map('map').setView([38.0, 23.7], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
    }).addTo(map);

    // Marker
    let marker = L.marker([38.0, 23.7]).addTo(map);

    // Fetch data from Apps Script
    function fetchData() {
      fetch("https://script.google.com/macros/s/AKfycbz58X2d8UBo6YkX3cVNCOfXPhhtudIhzx6CZgClA1S1uEBt_dkze_Fy40F9j_5NNTLYgw/exec?action=getLatest")
        .then(res => res.json())
        .then(data => {
          const lat = parseFloat(data.latitude);
          const lng = parseFloat(data.longitude);

          marker.setLatLng([lat, lng]);
          map.setView([lat, lng]);

          document.getElementById("speed").innerText = data.speed;
          document.getElementById("alcohol").innerText = data.alcohol;
          document.getElementById("acc").innerText = data.acc;
          document.getElementById("time").innerText = data.timestamp;
        })
        .catch(err => {
          console.error("Fetch error:", err);
        });
    }

    fetchData();
    setInterval(fetchData, 3000);
  </script>
  

</body>
</html>
